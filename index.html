<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mosswood Apothecary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="mosswood-intro">

    <main class="mosswood-entrance">

        <!-- =====================================
             BACKGROUND
        ====================================== -->

        <div class="mosswood-background"></div>

        <div class="mosswood-vignette"></div>


        <!-- =====================================
             MOSSWOOD SIGN
        ====================================== -->

        <img
            class="mosswood-sign"
            src="assets/images/mosswood-sign.png"
            alt="Mosswood Apothecary">


        <!-- =====================================
             INTRO TEXT
        ====================================== -->

        <div class="mosswood-intro-copy">

            <p>
                At the edge of the woods, an old apothecary
                waits beneath the trees.
            </p>

            <span>
                Grow strange plants · Forage forgotten paths ·
                Brew mysterious remedies
            </span>

        </div>


        <!-- =====================================
             ENTER MOSSWOOD
        ====================================== -->

        <a
            class="mosswood-enter"
            href="greenhouse.html"
            aria-label="Enter Mosswood">

            <img
                src="assets/images/enter-mosswood.png"
                alt="Enter Mosswood">

        </a>


        <!-- =====================================
             SAVE NOTE
        ====================================== -->

        <p class="mosswood-save-note">
            Your progress is saved automatically
        </p>

    </main>

</body>

</html>
