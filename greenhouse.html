<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenhouse | Mosswood Apothecary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- =====================================
         SHARED SIDEBAR
         Created by js/navigation.js
    ====================================== -->

    <aside
        class="sidebar"
        id="sidebar">
    </aside>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="content">


        <!-- =================================
             SHARED RESOURCE BAR
             Created by js/navigation.js
        ================================== -->

        <header
            class="topbar"
            id="topbar">
        </header>


        <!-- =================================
             GREENHOUSE
        ================================== -->

        <section class="screen">

            <p class="eyebrow">
                MOSSWOOD GROUNDS
            </p>


            <h2>
                Greenhouse
            </h2>


            <p class="description">
                Grow strange plants, discover rare ingredients,
                and care for the greenhouse hidden deep within Mosswood.
            </p>


            <!-- =============================
                 GREENHOUSE INFORMATION
            ============================== -->

            <div class="greenhouse-heading">

                <div>

                    <span class="card-label">
                        GREENHOUSE LEVEL
                    </span>

                    <h3>
                        Level
                        <span id="greenhouseLevel">
                            1
                        </span>
                    </h3>

                </div>


                <div class="seed-counter">

                    Moonmint Seeds

                    <strong id="moonmintSeeds">
                        0
                    </strong>

                </div>

            </div>


            <!-- =============================
                 PLANTING PLOTS
                 Generated by greenhouse.js
            ============================== -->

            <div
                class="plots"
                id="plots">
            </div>


            <!-- =============================
                 HARVEST STORAGE
            ============================== -->

            <section class="inventory-panel">

                <div class="inventory-title">

                    <div>

                        <span class="card-label">
                            HARVEST STORAGE
                        </span>

                        <h3>
                            Ingredients
                        </h3>

                    </div>

                </div>


                <!-- MOONMINT -->

                <div class="ingredient-card">

                    <div class="ingredient-icon">
                        🌿
                    </div>


                    <div>

                        <strong>
                            Moonmint
                        </strong>

                        <p>
                            A cool, fragrant herb with calming properties.
                        </p>

                    </div>


                    <span
                        class="ingredient-count"
                        id="moonmintInventory">

                        0

                    </span>

                </div>

            </section>


            <!-- =============================
                 GAME MESSAGE
            ============================== -->

            <div
                class="game-message"
                id="gameMessage">

                Your greenhouse is waiting.

            </div>

        </section>

    </main>

</div>


<!-- =========================================
     JAVASCRIPT

     1. game.js
        Loads shared save data.

     2. navigation.js
        Creates sidebar and resource bar.

     3. greenhouse.js
        Controls planting, watering,
        growing, and harvesting.
========================================== -->

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/navigation.js"></script>
<script src="js/greenhouse.js"></script>

</body>

</html>
