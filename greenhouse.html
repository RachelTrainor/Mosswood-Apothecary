<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greenhouse | Mosswood Apothecary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <!-- =====================================
         SHARED SIDEBAR
         Created by js/navigation.js
    ====================================== -->

    <aside
        class="sidebar"
        id="sidebar">
    </aside>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <main class="content">


        <!-- =================================
             SHARED RESOURCE BAR
             Created by js/navigation.js
        ================================== -->

        <header
            class="topbar"
            id="topbar">
        </header>


        <!-- =================================
             GREENHOUSE
        ================================== -->

        <section class="screen">

            <p class="eyebrow">
                MOSSWOOD GROUNDS
            </p>


            <h2>
                Greenhouse
            </h2>


            <p class="description">
                Grow strange plants, discover rare ingredients,
                and care for the greenhouse hidden deep within Mosswood.
            </p>


            <!-- =============================
                 GREENHOUSE INFORMATION
            ============================== -->

            <div class="greenhouse-heading">

                <div>

                    <span class="card-label">
                        GREENHOUSE LEVEL
                    </span>

                    <h3>
                        Level
                        <span id="greenhouseLevel">
                            1
                        </span>
                    </h3>

                </div>

            </div>


            <!-- =============================
                 PLANTING PLOTS
                 Generated by greenhouse.js
            ============================== -->

            <div
                class="plots"
                id="plots">
            </div>


            <!-- =============================
                 GAME MESSAGE
            ============================== -->

            <div
                class="game-message"
                id="gameMessage">

                Your greenhouse is waiting.

            </div>

        </section>

    </main>

</div>


<!-- =========================================
     JAVASCRIPT

     data.js
        Contains plant, potion, recipe,
        and other shared game data.

     game.js
        Loads shared save data.

     navigation.js
        Creates sidebar and resource bar.

     greenhouse.js
        Controls planting, watering,
        growing, harvesting, and
        mystery plant discovery.
========================================== -->

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/navigation.js"></script>
<script src="js/greenhouse.js"></script>

</body>

</html>
